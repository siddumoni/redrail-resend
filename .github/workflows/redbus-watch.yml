name: RedRail Train Availability Watcher

on:
  workflow_dispatch:

permissions:
  contents: write  # needed to commit state.json back to the repo

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      - name: Install virtual display (xvfb)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Diagnose connectivity to redbus.in
        run: |
          echo "Testing HTTPS reachability from this runner..."
          curl -sS -L --max-time 15 -o /dev/null -w "HTTP status: %{http_code}\nTotal time: %{time_total}s\n" https://www.redbus.in || echo "curl FAILED - likely blocked at network level"
        continue-on-error: true

      - name: Run watcher
        env:
          REDBUS_WATCHES: ${{ vars.REDBUS_WATCHES }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RESEND_TO: ${{ secrets.RESEND_TO }}
          REDBUS_FAIL_THRESHOLD: "3"
          # Headed Chromium inside a virtual display; matches the successful local mode.
          REDBUS_HEADLESS: "false"
          REDBUS_DISABLE_HTTP2: "false"
        run: xvfb-run -a python -m redbus_watch.main

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update state.json [skip ci]"
          git push
